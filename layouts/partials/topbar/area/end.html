{{- /*
  I4C 2026 — Relearn Topbar End Override

  Adds IEEE IES and IEEE logos to the right side of the
  existing Relearn topbar.

  No theme button partials are called here.
*/ -}}

<div class="site-brand-logos">

  <a
    href="https://www.ieee-ies.org/"
    target="_blank"
    rel="noopener noreferrer"
    aria-label="IEEE Industrial Electronics Society"
  >
    <img
      src="{{ "images/ies.png" | relURL }}"
      alt="IEEE Industrial Electronics Society"
    >
  </a>

  <a
    href="https://www.ieee.org/"
    target="_blank"
    rel="noopener noreferrer"
    aria-label="IEEE"
  >
    <img
      src="{{ "images/ieee.png" | relURL }}"
      alt="IEEE"
    >
  </a>

</div>

<style>

  .site-brand-logos {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.7rem;
    height: 100%;
    padding: 0 0.5rem;
    flex-shrink: 0;
  }

  .site-brand-logos a {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    text-decoration: none;
    opacity: 0.92;
    transition:
      opacity 0.15s ease,
      transform 0.15s ease;
  }

  .site-brand-logos a:hover {
    opacity: 1;
    transform: translateY(-1px);
  }

  .site-brand-logos img {
    display: block;
    width: auto;
    height: 2rem;
    max-width: 7rem;
    object-fit: contain;
  }

  @media (max-width: 576px) {

    .site-brand-logos {
      gap: 0.4rem;
      padding: 0 0.25rem;
    }

    .site-brand-logos img {
      height: 1.5rem;
      max-width: 5rem;
    }

  }

  @media (prefers-reduced-motion: reduce) {

    .site-brand-logos a {
      transition: none;
    }

  }

</style>
