{{- /*
  Usage:

  {{< card title="..." >}}
  markdown
  {{< /card >}}

  Custom card with:
  - IEEE orange top accent
  - Optional title
  - Clean body container
  - Raw HTML support for custom layouts such as flex/grid
*/ -}}

<div class="card">
  {{- with .Get "title" }}
    <h3 class="card-header">{{ . }}</h3>
  {{- end }}

  <div class="card-body">
    {{ .Inner}}
  </div>
</div>

<style>
  article .card {
    width: 100%;
    box-sizing: border-box;
    background: #fff;
    border: 1px solid var(--SITE-BORDER, #e2e8f0);
    border-top: 3px solid #e88720;
    border-radius: 6px;
    box-shadow: 0 1px 3px rgba(15, 23, 42, 0.05);
    margin: 1rem 0;
    overflow: hidden;
  }

  article .card > .card-header {
    font-size: 1.1rem;
    font-weight: 600;
    color: var(--SITE-HEADING, #0f172a);
    background: transparent;
    padding: 0.9rem 1.25rem 0.4rem;
    margin: 0;
    border: 0;
  }

  article .card > .card-body {
    width: 100%;
    box-sizing: border-box;
    padding: 1rem 1.25rem;
    color: var(--SITE-TEXT, #334155);
    font-size: 0.95rem;
    line-height: 1.55;
  }

  /* Prevent Markdown-generated paragraphs from interfering
     with custom HTML layouts inside the card */
  article .card > .card-body > p:first-child {
    margin-top: 0;
  }

  article .card > .card-body > p:last-child {
    margin-bottom: 0;
  }

  article .card > .card-body ul,
  article .card > .card-body ol {
    padding-inline-start: 1.25rem;
    margin: 0.4rem 0;
  }

  article .card > .card-body ul li,
  article .card > .card-body ol li {
    margin: 0.2rem 0;
  }

  /* Allow custom flex/grid components inside cards
     to occupy the complete card width */
  article .card > .card-body > .i4c-event-details {
    display: flex !important;
    width: 100% !important;
    max-width: none !important;
    box-sizing: border-box;
  }

  /* Remove paragraph spacing if Markdown creates
     a paragraph around custom content */
  article .card > .card-body > .i4c-event-details p {
    margin-top: 0;
  }
</style>
