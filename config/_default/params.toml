# ============================================================================
# Hugo / Relearn Theme Parameters
# IEEE IES Industrial Innovation Conclave 2026
# ============================================================================

# If an option value is said to be not set, you can achieve the same behavior
# by giving it an empty string value.

###############################################################################
# Hugo
###############################################################################

# The author of the site.
# Used in HTML meta tags, OpenGraph and Twitter cards.
author.name = "IEEE IES Industrial Innovation Conclave 2026"

# Social media image of the site.
images = ["images/banner.jpg"]

# The description of the site lives in:
# content/_index.en.md


###############################################################################
# Admin options for social media
###############################################################################

social.facebook_admin = ""
social.twitter = ""


###############################################################################
# Relearn Theme
###############################################################################

#++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++
# Branding
#++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++

# Logo shown at the top of the sidebar menu.
logo = { src = "/images/HubsandNodes_Logo.jpg" }

# Theme color variant.
themeVariant = [
  { identifier = "zen-light" },
]

# Filename suffix for variant files.
themeVariantModifier = ""


#++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++
# General
#++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++

disableAssetsBusting = false
disableGeneratorVersion = false
disableRandomIds = false

# Multilanguage content.
additionalContentLanguage = ["en"]


#++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++
# Topbar
#++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++

# Hide the table of contents button.
disableToc = true

# Hide breadcrumbs.
disableBreadcrumb = true

# Hide Next and Previous navigation buttons.
disableNextPrev = true

# Uncomment if you want an Edit button pointing to the GitHub repository.
# editURL = "https://github.com/ieee-ies/i4c2026.ieee-ies.org/blob/main/content/"


#++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++
# Menu
#++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++

# Search box.
search.disable = false

# Hide the Home entry.
disableLandingPageButton = true

# Order main menu sections by weight.
ordersectionsby = "weight"

# Initial expand state of submenus.
alwaysopen = false

# Show expanders for submenus.
collapsibleMenu = true

# Show checkmarks for visited links.
showVisitedLinks = false

# Hide heading above shortcut menu.
disableShortcutsTitle = false

# Hide language switcher.
disableLanguageSwitchingButton = false


#++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++
# Hidden pages
#++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++

# Hide hidden pages from search.
disableSearchHiddenPages = false

# Hide hidden pages from web crawlers.
disableSeoHiddenPages = true

# Hide hidden pages from taxonomies.
disableTagHiddenPages = false


#++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++
# Content
#++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++

# Title separator.
titleSeparator = "::"

# Breadcrumb separator.
breadcrumbSeparator = ">"

# Hide root breadcrumb.
disableRootBreadcrumb = true

# Hide breadcrumbs on taxonomy term pages.
disableTermBreadcrumbs = false


#++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++
# Highlight
#++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++

# Hide copy-to-clipboard for inline code.
disableInlineCopyToClipBoard = true

# Always show copy-to-clipboard for block code.
disableHoverBlockCopyToClipBoard = false

# Wrap code blocks.
highlightWrap = true


#++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++
# Images
#++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++

imageEffects.border = true
imageEffects.lightbox = true
imageEffects.shadow = false


#++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++
# Links
#++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++

# Open external links in a new tab.
externalLinkTarget = "_blank"

# Generate link URLs the Hugo way.
disableExplicitIndexURLs = false


#++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++
# MathJax
#++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++

mathJaxInitialize = "{}"

# Only load MathJax when required.
math.disable = true

# External MathJax URL.
customMathJaxURL = ""


#++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++
# Mermaid
#++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++

# Make Mermaid graphs panable and zoomable.
mermaidZoom = true

# Mermaid initialization options.
mermaidInitialize = '{ "securityLevel": "loose" }'

# Only load Mermaid when required.
mermaid.disable = true

# External Mermaid URL.
customMermaidURL = ""


#++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++
# OpenAPI
#++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++

# Only load OpenAPI when required.
openapi.disable = true

# External OpenAPI URL.
customOpenapiURL = ""


#++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++
# Table of Contents
#++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++

includeTOC = true


#++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++
# Link checking
#++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++

# Surface broken-link issues as warnings.
[link]
  errorlevel = "warning"

  # Add URL patterns here only when Hugo should ignore them.
  # urlIgnoreCheck = ['^https://intranet\.example\.org/']
